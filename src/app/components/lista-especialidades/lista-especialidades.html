<div class="sidebar-especialidades">
    <h3><i class="fas fa-notes-medical me-2" aria-hidden="true"></i>Especialidades</h3>
    <div class="list-group list-group-flush">
        @for (esp of especialidades; track esp.clave) {
        <button type="button" class="list-group-item list-group-item-action" [class.active]="seleccionada() === esp"
            (click)="seleccionar(esp)">
            <i class="fas fa-chevron-right me-2" aria-hidden="true"></i>{{ esp.nombre }}
        </button>
        }
    </div>
    <p class="esp-description" aria-live="polite">
        {{ seleccionada()?.descripcion ?? 'Seleccione una especialidad para ver su descripción.' }}
    </p>
</div>
