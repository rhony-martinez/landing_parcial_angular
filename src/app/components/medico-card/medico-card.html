<div class="card medico-card h-100">
    <img [src]="medico().foto" [alt]="medico().nombre" class="card-img-top img-fluid border">
    <div class="card-body d-flex flex-column">
        <h5 class="card-title">{{ medico().nombre }}</h5>
        <p class="card-subtitle mb-2">{{ medico().especialidad }}</p>
        <p class="card-text flex-grow-1">{{ medico().descripcion }}</p>
        <button type="button" class="btn btn-cta btn-sm mt-2">Agendar Cita</button>
    </div>
</div>
