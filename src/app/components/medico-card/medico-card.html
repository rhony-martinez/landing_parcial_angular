<div class="card medico-card h-100">
    <div class="medico-card__img-wrap">
        <img [src]="medico().foto" [alt]="medico().nombre" class="card-img-top img-fluid">
    </div>
    <div class="card-body d-flex flex-column">
        <h5 class="card-title">
            <i class="fas fa-user-doctor me-2" aria-hidden="true"></i>{{ medico().nombre }}
        </h5>
        <p class="card-subtitle mb-2">
            <i class="fas fa-stethoscope me-1" aria-hidden="true"></i>{{ medico().especialidad }}
        </p>
        <p class="card-text flex-grow-1">{{ medico().descripcion }}</p>
        <button type="button" class="btn btn-cta btn-sm mt-2 w-100">
            <i class="fas fa-calendar-check me-1" aria-hidden="true"></i>Agendar Cita
        </button>
    </div>
</div>
